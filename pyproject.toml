[project]
name = "tennis-ai"
version = "0.1.0"
description = "Serve Lab: AI assistant that analyzes the tennis serve from video."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.30.0",
    "mlx-vlm>=0.7.9",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
