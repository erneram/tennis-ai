# Serve drills, one or more per category of criteria.yaml.
# Version 0.2. Written by the team from common practice; not reviewed by a coach. Kept short,
# slow and low-load so they are safe to do alone.
# 0.2: removed feet_line and trophy_pause with their categories (see criteria.yaml 0.3).
# 0.3: added steady_serves for no_clear_problem (criteria.yaml 0.5).
version: "0.3"

drills:
  - id: toss_target
    category: toss_arm_bent
    name: Lanzamiento al blanco
    instructions: Pon la raqueta en el suelo delante de tu pie adelantado. Lanza la pelota con el brazo recto, sin golpearla, y haz que caiga sobre las cuerdas. 3 series de 10.
  - id: toss_hold
    category: toss_arm_drops_early
    name: Brazo arriba hasta el golpe
    instructions: Lanza y deja el brazo de lanzamiento apuntando a la pelota hasta que la raqueta empiece a subir. Haz 3 series de 8 saques suaves concentrándote solo en esa pausa.
  - id: knee_load
    category: insufficient_knee_bend
    name: Carga de piernas
    instructions: Desde la posición de trofeo, flexiona las rodillas hasta sentir carga en los muslos y empuja hacia arriba hacia la pelota. Practica 10 saltos sin raqueta y luego 10 saques.
  - id: high_reach
    category: bent_arm_at_contact
    name: Alcanzar el punto más alto
    instructions: Pide a un compañero que sostenga una pelota en alto, por encima de tu alcance con el brazo extendido. Haz 10 golpes de sombra tocándola con la raqueta y el brazo totalmente estirado.
  - id: higher_toss
    category: low_contact_point
    name: Impacto arriba
    instructions: Lanza un poco más alto y espera a golpear cuando la pelota empiece a bajar, con el brazo extendido. 3 series de 10 saques al 60 % de velocidad.
  - id: land_and_hold
    category: unbalanced_finish
    name: Aterriza y sostén
    instructions: Después de cada saque, aterriza sobre el pie adelantado dentro de la cancha y mantén el equilibrio 2 segundos. 3 series de 8.
  - id: steady_serves
    category: no_clear_problem
    name: Repetir el mismo saque
    instructions: Haz 3 series de 10 saques al 70 % de velocidad buscando repetir siempre el mismo movimiento. Al terminar, graba otro saque de lado para revisarlo de nuevo.
