<svg xmlns="http://www.w3.org/2000/svg" width="1789" height="494" viewBox="-2 -2 1789 494" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb3c8"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d5dde6; stroke-width: 1.5; }
      .ours { fill: #ffffff; stroke: #1e4f8c; stroke-width: 3; }
      .disc { fill: #eaf1f9; }
      .ico { fill: none; stroke: #1e4f8c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .t { font-size: 32px; font-weight: bold; fill: #0b1f2a; text-anchor: middle; }
      .s { font-size: 24px; fill: #2b3a45; text-anchor: middle; }
      .arrow { stroke: #9fb3c8; stroke-width: 3; fill: none; marker-end: url(#a); }
    </style>
    <g id="ball">
      <circle r="9" fill="#d6e84a" stroke="#b5c536" stroke-width="1.5"/>
      <path d="M -6.4 -6.4 Q -1.2 0 -6.4 6.4 M 6.4 -6.4 Q 1.2 0 6.4 6.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 1. Video -->
  <g transform="translate(0 0)">
    <rect class="card" width="297" height="400" rx="16"/>
    <circle class="disc" cx="148.5" cy="120" r="72"/>
    <rect class="ico" x="126.5" y="80" width="44" height="80" rx="8"/>
    <path d="M 141 106 L 159 120 L 141 134 Z" fill="#1e4f8c"/>
    <text class="t" x="148.5" y="264">Video</text>
    <text class="s" x="148.5" y="306">del saque, de lado,</text>
    <text class="s" x="148.5" y="338">con el teléfono</text>
  </g>

  <!-- 2. Pose: a serving figure drawn as keypoints -->
  <g transform="translate(372 0)">
    <rect class="card" width="297" height="400" rx="16"/>
    <circle class="disc" cx="148.5" cy="120" r="72"/>
    <g transform="translate(150 132)">
      <path class="ico" d="M -4 -22 L 2 10 M 2 10 L -10 40 M 2 10 L 16 38 M -2 -14 L 14 -26 L 22 -44 M -2 -14 L -20 -34 L -24 -52"/>
      <ellipse class="ico" cx="27" cy="-60" rx="8" ry="12" transform="rotate(20 27 -60)"/>
      <circle cx="-6" cy="-32" r="8" fill="#1e4f8c"/>
      <g fill="#1e4f8c"><circle cx="-2" cy="-14" r="4.5"/><circle cx="14" cy="-26" r="4.5"/><circle cx="-20" cy="-34" r="4.5"/><circle cx="2" cy="10" r="4.5"/><circle cx="-10" cy="40" r="4.5"/><circle cx="16" cy="38" r="4.5"/></g>
      <use href="#ball" x="-30" y="-66"/>
    </g>
    <text class="t" x="148.5" y="264">Pose</text>
    <text class="s" x="148.5" y="306">MediaPipe marca</text>
    <text class="s" x="148.5" y="338">33 puntos del cuerpo</text>
  </g>

  <!-- 3. Check -->
  <g transform="translate(744 0)">
    <rect class="card" width="297" height="400" rx="16"/>
    <circle class="disc" cx="148.5" cy="120" r="72"/>
    <rect class="ico" x="116.5" y="88" width="64" height="64" rx="12"/>
    <path class="ico" d="M 132 121 L 144 133 L 166 108"/>
    <text class="t" x="148.5" y="264">Chequeo</text>
    <text class="s" x="148.5" y="306">si no se ve bien,</text>
    <text class="s" x="148.5" y="338">pide otro video</text>
  </g>

  <!-- 4. Our network -->
  <g transform="translate(1116 0)">
    <rect class="ours" width="297" height="400" rx="16"/>
    <circle class="disc" cx="148.5" cy="120" r="72"/>
    <g transform="translate(148.5 120)" stroke="#9fb3c8" stroke-width="2">
      <path d="M -32 -26 L 0 -13 M -32 -26 L 0 13 M -32 0 L 0 -13 M -32 0 L 0 13 M -32 26 L 0 -13 M -32 26 L 0 13 M 0 -13 L 32 0 M 0 13 L 32 0"/>
      <g fill="#1e4f8c" stroke="none"><circle cx="-32" cy="-26" r="7"/><circle cx="-32" cy="0" r="7"/><circle cx="-32" cy="26" r="7"/><circle cx="0" cy="-13" r="7"/><circle cx="0" cy="13" r="7"/><circle cx="32" cy="0" r="8"/></g>
    </g>
    <text class="t" x="148.5" y="264">Nuestra red</text>
    <text class="s" x="148.5" y="306">entrenada por el equipo:</text>
    <text class="s" x="148.5" y="338">mira brazo y hombro</text>
  </g>

  <!-- 5. Exercise -->
  <g transform="translate(1488 0)">
    <rect class="card" width="297" height="400" rx="16"/>
    <circle class="disc" cx="148.5" cy="120" r="72"/>
    <g transform="translate(140 126) rotate(-35)">
      <ellipse class="ico" cx="0" cy="-16" rx="20" ry="26"/>
      <path d="M -10 -36 L -10 4 M 0 -42 L 0 10 M 10 -36 L 10 4 M -18 -26 L 18 -26 M -20 -16 L 20 -16 M -18 -6 L 18 -6" stroke="#1e4f8c" stroke-width="2" fill="none"/>
      <path class="ico" d="M 0 10 L 0 40" stroke-width="7"/>
    </g>
    <use href="#ball" x="180" y="146" transform="translate(180 146) scale(1.5) translate(-180 -146)"/>
    <text class="t" x="148.5" y="264">Ejercicio</text>
    <text class="s" x="148.5" y="306">qué corregir y</text>
    <text class="s" x="148.5" y="338">qué tan seguro está</text>
  </g>

  <path class="arrow" d="M 305 120 H 362"/>
  <path class="arrow" d="M 677 120 H 734"/>
  <path class="arrow" d="M 1049 120 H 1106"/>
  <path class="arrow" d="M 1421 120 H 1478"/>

  <text x="892" y="470" font-size="30" fill="#2b3a45" text-anchor="middle"><tspan font-weight="bold" fill="#1e4f8c">3 a 6 segundos</tspan> por saque · en la Mac · sin internet</text>
</svg>
