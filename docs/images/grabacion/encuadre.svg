<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Helvetica, Arial, sans-serif">
  <title>Encuadre correcto en la pantalla del teléfono</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b705"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#ffffff"/>
  <rect x="10" y="20" width="620" height="355" rx="36" fill="#1d2733"/>

  <!-- Pantalla 16:9. Cámara a 1.3 m de alto y 6 m del jugador: horizonte en el centro. -->
  <svg x="40" y="40" width="560" height="315" viewBox="0 0 560 315">
    <rect width="560" height="157.5" fill="#cfe3ee"/>
    <rect y="157.5" width="560" height="157.5" fill="#4f7f62"/>
    <!-- Cancha: a la derecha de la línea de fondo, hasta la lateral de dobles lejana -->
    <rect x="280" y="200.2" width="280" height="114.8" fill="#2f6690"/>
    <g stroke="#ffffff" stroke-width="3">
      <line x1="280" y1="200.2" x2="280" y2="315"/>
      <line x1="280" y1="200.2" x2="560" y2="200.2"/>
      <line x1="280" y1="205.5" x2="560" y2="205.5" stroke-width="2"/>
      <line x1="280" y1="233.8" x2="292" y2="233.8" stroke-width="2"/>
    </g>

    <!-- Jugador diestro en el impacto (en el aire), visto del lado del pecho -->
    <ellipse cx="292" cy="250" rx="18" ry="3.5" fill="#000000" opacity="0.25"/>
    <g stroke="#1d2733" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="286,164 296,196 300,226 306,228"/>
      <polyline points="286,164 278,194 268,214 264,218"/>
      <line x1="286" y1="164" x2="292" y2="129"/>
      <polyline points="290,131 300,146 294,158"/>
      <polyline points="292,130 296,105 299,86"/>
      <line x1="299" y1="86" x2="301" y2="62" stroke-width="3.5"/>
      <ellipse cx="302" cy="48" rx="8" ry="14" stroke-width="3" transform="rotate(5 302 48)"/>
    </g>
    <circle cx="295" cy="114" r="8" fill="#f0c9a0" stroke="#1d2733" stroke-width="2.5"/>

    <!-- Indicaciones -->
    <g stroke="#f2b705" stroke-width="2">
      <line x1="330" y1="4" x2="330" y2="32" marker-start="url(#a)" marker-end="url(#a)"/>
      <line x1="200" y1="253" x2="200" y2="311" marker-start="url(#a)" marker-end="url(#a)"/>
      <line x1="244" y1="106" x2="244" y2="232"/>
      <line x1="238" y1="106" x2="250" y2="106"/>
      <line x1="238" y1="232" x2="250" y2="232"/>
      <line x1="332" y1="272" x2="430" y2="272" marker-end="url(#a)"/>
    </g>
    <g font-size="13" font-weight="bold" fill="#ffffff" stroke="#1d2733" stroke-width="3" paint-order="stroke">
      <text x="338" y="23">espacio arriba</text>
      <text x="208" y="287">espacio abajo</text>
      <text x="236" y="166" text-anchor="end">cuerpo ≈ 40 %</text>
      <text x="236" y="182" text-anchor="end">de la altura</text>
      <text x="332" y="264">espacio para aterrizar</text>
      <text x="288" y="306" font-size="12">línea de fondo: vertical, en el centro</text>
    </g>
    <text x="548" y="140" fill="#1d2733" font-size="13" font-weight="bold" text-anchor="end">hacia la red →</text>
    <circle cx="16" cy="16" r="5" fill="#e53935"/>
    <text x="26" y="21" fill="#1d2733" font-size="12" font-weight="bold">1080p · 60 fps</text>
  </svg>
</svg>
