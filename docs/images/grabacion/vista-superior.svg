<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Helvetica, Arial, sans-serif">
  <title>Vista superior: dónde poner la cámara</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Escala: 36 px = 1 m. Cancha de dobles: 10.97 m de ancho. -->
  <rect width="640" height="480" fill="#4f7f62"/>
  <rect x="50" y="0" width="394.9" height="330" fill="#2f6690"/>
  <g stroke="#ffffff" stroke-width="3">
    <line x1="50" y1="0" x2="50" y2="330"/>
    <line x1="444.9" y1="0" x2="444.9" y2="330"/>
    <line x1="99.3" y1="0" x2="99.3" y2="330"/>
    <line x1="395.6" y1="0" x2="395.6" y2="330"/>
    <line x1="50" y1="330" x2="444.9" y2="330"/>
    <line x1="99.3" y1="132.5" x2="395.6" y2="132.5"/>
    <line x1="247.5" y1="0" x2="247.5" y2="132.5"/>
    <line x1="247.5" y1="330" x2="247.5" y2="320"/>
  </g>
  <g fill="#ffffff" font-size="12">
    <text x="170" y="52" font-size="14" font-weight="bold" text-anchor="middle">▲ hacia la red</text>
    <text x="106" y="322">línea de fondo</text>
    <text x="434" y="200" font-size="11" text-anchor="middle" transform="rotate(-90 434 200)">línea lateral de dobles</text>
  </g>

  <!-- Campo de visión de la cámara correcta -->
  <polygon points="499,330 250,186 250,474" fill="#f2b705" opacity="0.25"/>

  <!-- Jugador diestro visto desde arriba: hombro izquierdo hacia la red, pecho hacia la cámara -->
  <rect x="273" y="322" width="14" height="36" rx="7" fill="#1d2733"/>
  <circle cx="280" cy="340" r="8" fill="#f0c9a0" stroke="#1d2733" stroke-width="2"/>
  <line x1="291" y1="340" x2="314" y2="340" stroke="#ffffff" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#ffffff">
    <text x="318" y="344" font-size="11">pecho</text>
    <text x="228" y="345" font-size="12" font-weight="bold" text-anchor="end">jugador diestro</text>
  </g>

  <!-- Cámara correcta -->
  <rect x="499" y="321" width="30" height="18" rx="3" fill="#f2b705" stroke="#1d2733" stroke-width="2"/>
  <circle cx="499" cy="330" r="5" fill="#1d2733"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="514" y="290" font-size="13" font-weight="bold">✓ CÁMARA</text>
    <text x="514" y="305" font-size="11">sobre la línea de fondo</text>
    <text x="530" y="360" font-size="11">≈ 1.5 m fuera de la</text>
    <text x="530" y="374" font-size="11">lateral de dobles</text>
  </g>

  <!-- Distancia -->
  <g stroke="#ffffff" stroke-width="1.5">
    <line x1="282" y1="398" x2="497" y2="398" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="280" y1="390" x2="280" y2="406"/>
    <line x1="499" y1="390" x2="499" y2="406"/>
  </g>
  <text x="390" y="391" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">≈ 6 m</text>

  <!-- Posiciones incorrectas -->
  <rect x="267" y="162" width="26" height="16" rx="3" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="300" y="175" fill="#ffffff" font-size="12">✗ de frente, desde la cancha</text>
  <rect x="359" y="438" width="26" height="16" rx="3" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="392" y="451" fill="#ffffff" font-size="12">✗ detrás en diagonal (primeros 7 videos)</text>

  <g fill="#ffffff" font-size="12">
    <text x="458" y="40" font-weight="bold">Zurdo: todo en espejo.</text>
    <text x="458" y="56">Saca a la izquierda de la</text>
    <text x="458" y="72">marca central y pon la</text>
    <text x="458" y="88">cámara a tu izquierda.</text>
  </g>
</svg>
